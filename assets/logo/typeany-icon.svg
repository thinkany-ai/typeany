<!-- TypeAny app icon: a square keyboard keycap with two text-cursor eyes. Brand color #14B8A6 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1CC6B4"/>
      <stop offset="1" stop-color="#0EA192"/>
    </linearGradient>
    <!-- keycap walls: lit from above, darker toward the bottom -->
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF8F6"/>
      <stop offset="0.5" stop-color="#CFEAE5"/>
      <stop offset="1" stop-color="#93CBC2"/>
    </linearGradient>
    <!-- slightly dished top face -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F6F5"/>
    </linearGradient>
    <!-- eye holes: cut through the keycap, showing the brand color behind -->
    <linearGradient id="hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B9686"/>
      <stop offset="1" stop-color="#17BBA8"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#04453E" flood-opacity="0.35"/>
    </filter>
    <filter id="faceShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4F8F86" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824pt body, ~185pt corner radius -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <!-- keycap base: a 500×500 square, nudged down so the white face sits at the optical centre -->
  <rect x="262" y="278" width="500" height="500" rx="118" fill="url(#wall)" filter="url(#drop)"/>
  <!-- top face, inset: thin walls at top and sides, a deeper wall at the bottom -->
  <rect x="300" y="298" width="424" height="412" rx="92" fill="url(#face)" filter="url(#faceShadow)"/>
  <!-- rim highlight along the top edge of the face -->
  <rect x="300" y="298" width="424" height="412" rx="92" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.9"/>
  <!-- eyes: two text-cursor bars, set wide and high so they read as eyes -->
  <rect x="397" y="400" width="50" height="120" rx="25" fill="url(#hole)"/>
  <rect x="577" y="400" width="50" height="120" rx="25" fill="url(#hole)"/>
</svg>
